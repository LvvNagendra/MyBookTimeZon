# =========================
# SPRING CONFIG
# =========================
spring:
  application:
    name: mybooktimezone

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# =========================
# SERVER CONFIG
# =========================
server:
  port: ${SERVER_PORT:8090}

# =========================
# APP CONFIG
# =========================
app:
  beauty-coach:
    enabled: true

    # 🔥 Choose provider: GEMINI / OPENAI / AUTO (AUTO prefers Gemini when GEMINI_API_KEY is set)
    llm: ${BEAUTY_COACH_LLM:AUTO}

    # =========================
    # 🔑 API KEYS
    # =========================
    openai-api-key: ${OPENAI_API_KEY:}
    gemini-api-key: ${GEMINI_API_KEY:}

    # =========================
    # 🌐 BASE URLS
    # =========================
    openai-base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    gemini-base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}

    # =========================
    # 🤖 MODELS
    # =========================
    openai-model: ${OPENAI_MODEL:gpt-4o-mini}
    gemini-model: ${GEMINI_MODEL:gemini-2.5-flash}

    # =========================
    # ⚙️ AI SETTINGS
    # =========================
    max-tokens: ${AI_MAX_TOKENS:700}
    temperature: ${AI_TEMPERATURE:0.65}

  # =========================
  # 🔔 NOTIFICATIONS
  # =========================
  notifications:
    confirmation-email-enabled: ${BOOKING_CONFIRM_EMAIL:false}
    day-reminder-email-enabled: ${BOOKING_REMINDER_EMAIL:false}
    staff-cc-on-booking: ${BOOKING_STAFF_CC:false}
    from-address: ${BOOKING_FROM_EMAIL:bookings@example.com}
    from-name: ${BOOKING_FROM_NAME:SalonGo}
    reminder-hour-local: 8
    reminder-window-minutes: 50