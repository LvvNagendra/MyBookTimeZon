# Local development — PostgreSQL + Flyway + Hibernate schema updates
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/mybooktimezon
    username: postgres
    password: 9912

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Prefer application-local.yml (gitignored) for real Gmail App Passwords.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 15000
          timeout: 15000
          writetimeout: 15000

  messages:
    basename: custom-messages

app:
  client:
    url: http://localhost:5173
  beauty-coach:
    openai-api-key: ${OPENAI_API_KEY:}
    api-key: ${OPENAI_API_KEY:}
    gemini-api-key: ${GEMINI_API_KEY:}
  notifications:
    # Overridden to true in application-local.yml when SMTP is configured
    confirmation-email-enabled: ${BOOKING_CONFIRM_EMAIL:false}
    day-reminder-email-enabled: ${BOOKING_REMINDER_EMAIL:false}
    from-address: ${BOOKING_FROM_EMAIL:bookings@slotnexa.app}
    from-name: SlotNexa

jwt:
  secret: 3Fbr8zUw5d4hCEa57MHthQkALWENIR2zkn1eT1c9tno=
  expiration-ms: 86400000

