# Automated tests / CI — H2 in-memory, Flyway migrations, Hibernate fills remaining tables
spring:
  datasource:
    url: jdbc:h2:mem:mybooktest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: localhost
    port: 3025
    username: test
    password: test
    properties:
      mail:
        smtp:
          auth: false

app:
  client:
    url: http://localhost:5173
  beauty-coach:
    enabled: false
  notifications:
    confirmation-email-enabled: false
    day-reminder-email-enabled: false
    staff-cc-on-booking: false

jwt:
  secret: test-secret-do-not-use-in-production-min-32-chars-long!!
  expiration-ms: 86400000

saas:
  trial-days: 14
  basic-monthly-paise: 49900
  standard-monthly-paise: 99900
  premium-monthly-paise: 149900
  bootstrap-super-admin:
    enabled: false

razorpay:
  key-id: ""
  key-secret: ""
  webhook-secret: ""
